spring.application.name=coach-api

# Read from environment variables, so secrets never appear in code or on GitHub.
# ${NAME:default} means "use the environment variable NAME, or this default if it's not set".
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.base-url=https://generativelanguage.googleapis.com

# The app must send this in the X-App-Key header. No default on purpose: without it the coach stays closed.
coach.app-key=${COACH_APP_KEY:}
# Most coach requests per day (UTC). Keep it below your Gemini free quota.
coach.daily-limit=${COACH_DAILY_LIMIT:15}

# Render tells the app which port to use in PORT; locally it's 8080.
server.port=${PORT:8080}